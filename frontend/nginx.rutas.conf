proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_read_timeout 30s;
proxy_connect_timeout 3s;
proxy_next_upstream off;
location /api/ { proxy_pass http://api:8000/; }
location = /docs { proxy_pass http://api:8000/docs; }
location = /openapi.json { proxy_pass http://api:8000/openapi.json; }
# Swagger usa las rutas originales. No se deriva cualquier ruta desconocida.
location ~ ^/(salud|catalogos|vinos|clientes|comprobantes|transferencias|ingresos|reportes)(/|$) {
    proxy_pass http://api:8000;
}
location / { try_files $uri $uri/ =404; }
