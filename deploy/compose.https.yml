# Usar junto con docker-compose.yml en una VM Linux ya autorizada.
# Requiere certificados reales externos al repositorio y Compose >= 2.24.4.
services:
  db:
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/run/tls/postgres.crt", "-c", "ssl_key_file=/run/tls/postgres.key"]
    volumes:
      - ${TLS_DIR:?Definir TLS_DIR absoluto}:/run/tls:ro
  api:
    environment:
      DB_SSLMODE: require
  frontend:
    ports: !override
      - "0.0.0.0:443:443"
    volumes:
      - ./deploy/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_DIR:?Definir TLS_DIR absoluto}:/run/tls:ro
